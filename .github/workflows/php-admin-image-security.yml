name: phpMyAdmin image source policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 -B scripts/test_php_admin_images.py
      - run: python3 -B scripts/check_php_admin_images.py
      - run: git diff --check
